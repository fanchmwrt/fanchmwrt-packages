<%+header%>
<link rel="stylesheet" href="<%=resource%>/css/common.css">
<script src="<%=resource%>/jquery-3.7.1.min.js"></script>
<script src="<%=resource%>/common.js"></script>

<style>
  #wireless-restart-modal { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(15, 23, 42, .45); }
  #wireless-restart-modal .restart-dialog { width: 100%; max-width: 360px; padding: 28px 20px; border-radius: 10px; background: var(--background-color-high, #fff); color: var(--text-color-highest, #1e293b); text-align: center; box-sizing: border-box; }
  #wireless-restart-modal .restart-spinner { width: 36px; height: 36px; margin: 0 auto 20px; border: 3px solid rgba(100, 116, 139, .25); border-top-color: #6383ef; border-radius: 50%; animation: wireless-restart-spin .8s linear infinite; }
  #wireless-restart-modal .restart-countdown { margin-top: 12px; font-size: 14px; opacity: .75; }
  @keyframes wireless-restart-spin { to { transform: rotate(360deg); } }
  #wireless-settings .ssid-card { border: 1px solid var(--border-color-low, #e5e7eb); border-radius: 8px; padding: 16px; margin: 16px 0; }
  #wireless-settings .ssid-card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  #wireless-settings .ssid-card-meta { font-size: 12px; margin-bottom: 14px; opacity: .75; overflow-wrap: anywhere; }
  #wireless-settings .readonly-note { margin: 0 0 16px; color: var(--text-color-high, #475569); font-size: 13px; }
  #wireless-settings .form-label { flex: 0 0 140px; }
  #wireless-settings .form-row > input,
  #wireless-settings .form-row > select { flex: 1; min-width: 0; width: 100%; max-width: 360px; box-sizing: border-box; }
  #wireless-settings .form-row > input:disabled,
  #wireless-settings .form-row > select:disabled { opacity: .8; }
  #wireless-settings .wireless-actions { justify-content: flex-end; flex-wrap: wrap; }
  #wireless-settings .status-tip { overflow-wrap: anywhere; }
  @media (max-width: 768px) {
    #wireless-settings .ssid-card { padding: 12px; }
    #wireless-settings .ssid-card .form-row { flex-direction: column; align-items: stretch; gap: 6px; }
    #wireless-settings .ssid-card .form-label { flex: auto; width: auto; }
    #wireless-settings .ssid-card .form-row > input,
    #wireless-settings .ssid-card .form-row > select { max-width: none; }
    #wireless-settings .ssid-card .switch { align-self: flex-start; }
  }
</style>

<div class="fwx-form-card" id="wireless-settings">
  <div class="form-title"><%:Wireless Interface%></div>
  <div class="form-desc"><%:Configure the first SSID of each radio interface%></div>
  <div id="ssid-card-list"></div>
  <div class="form-row wireless-actions">
    <button type="button" class="btn btn-secondary" id="wireless-refresh"><%:Refresh%></button>
    <button type="button" class="btn" id="wireless-save" disabled><%:Save & Apply%></button>
  </div>
  <div class="status-tip" id="wireless-tip" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';
  var api_get = '<%=url("admin/fwx_wireless/get_interface_info")%>';
  var api_set = '<%=url("admin/fwx_wireless/set_interface_info")%>';
  var csrf_token = '<%=token%>';
  var radio_list = [];
  var busy = false;
  var text = {
    loading: '<%:Loading...%>',
    load_failed: '<%:Load failed%>',
    save_failed: '<%:Save failed. Refresh the page and check the wireless configuration.%>',
    no_radio: '<%:No wireless radio found%>',
    no_iface: '<%:No SSID is configured on this radio. Configure it in the advanced wireless page first.%>',
    readonly: '<%:Client, relay and other non-AP configurations are read-only here.%>',
    advanced: '<%:This configuration requires advanced wireless settings and is read-only here.%>',
    ssid: '<%:SSID%>',
    password: '<%:Password%>',
    encryption: '<%:Encryption%>',
    cipher: '<%:Cipher%>',
    mode: '<%:Mode%>',
    ap: '<%:Access Point (AP)%>',
    client: '<%:Client / Relay%>',
    unknown: '<%:Unknown%>',
    device: '<%:Device%>',
    enable: '<%:Enable%>',
    enabled: '<%:Enabled%>',
    disabled: '<%:Disabled%>',
    hidden: '<%:Hidden SSID%>',
    isolate: '<%:Client Isolation%>',
    none: '<%:No Encryption%>',
    auto: '<%:Automatic%>',
    unavailable: '<%:Not supported by this firmware or band%>',
    ssid_invalid: '<%:SSID must contain 1 to 32 bytes without control characters.%>',
    key_invalid: '<%:Use 8 to 63 bytes, or a 64-digit hexadecimal WPA key. WPA3-SAE accepts 1 to 63 bytes.%>',
    no_changes: '<%:No changes to save%>',
    confirm: '<%:Applying wireless settings will disconnect wireless clients. Continue?%>',
    restarting: '<%:Wireless is restarting, please wait.%>',
    countdown: '<%:Countdown%>',
    seconds: '<%:seconds%>',
    uncertain: '<%:The connection was interrupted. Settings may have been applied. Reconnect and refresh to confirm.%>',
    discard: '<%:Discard unsaved changes and reload?%>'
  };

  function show_tip(message) {
    $('#wireless-tip').text(message || '');
  }

  function show_restart_modal(on_done) {
    var deadline = Date.now() + 30000;
    var modal = $('<div id="wireless-restart-modal">').appendTo('body');
    var dialog = $('<div class="restart-dialog" role="dialog" aria-modal="true" tabindex="-1">')
      .attr('aria-labelledby', 'wireless-restart-title').appendTo(modal);
    $('<div class="restart-spinner" aria-hidden="true">').appendTo(dialog);
    $('<div id="wireless-restart-title">').text(text.restarting).appendTo(dialog);
    var countdown = $('<div class="restart-countdown" role="timer">').appendTo(dialog);
    countdown.text(text.countdown + ': 30 ' + text.seconds);
    dialog.on('keydown', function (event) {
      if (event.key === 'Tab' || event.key === 'Escape') event.preventDefault();
    });
    dialog[0].focus();
    var timer = setInterval(function () {
      var left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      countdown.text(text.countdown + ': ' + left + ' ' + text.seconds);
      if (left === 0) {
        clearInterval(timer);
        modal.remove();
        on_done();
        $('#wireless-refresh').trigger('focus');
      }
    }, 250);
  }

  function set_busy(value) {
    busy = value;
    $('#wireless-refresh').prop('disabled', value);
    $('#wireless-save').prop('disabled', value || !radio_list.some(function (item) { return !item.read_only; }));
    radio_list.forEach(function (item) {
      item.card.find('input, select').prop('disabled', value || item.read_only);
    });
  }

  function split_encryption(value) {
    var parts = String(value || 'none').split('+');
    var base = parts.shift();
    var cipher = parts.join('+') || 'auto';
    if (cipher === 'aes') cipher = 'ccmp';
    if (cipher === 'tkip+aes' || cipher === 'aes+tkip' || cipher === 'ccmp+tkip') cipher = 'tkip+ccmp';
    return { base: base, cipher: cipher };
  }

  function encryption_options(item, features) {
    var is_6g = item.band === '6G';
    return [
      ['none', text.none, is_6g],
      ['owe', 'OWE', !(features & 4)],
      ['psk', 'WPA-PSK', is_6g || !(features & 1)],
      ['psk2', 'WPA2-PSK', is_6g || !(features & 1)],
      ['psk-mixed', 'WPA/WPA2-PSK', is_6g || !(features & 1)],
      ['sae', 'WPA3-SAE', !(features & 2)],
      ['sae-mixed', 'WPA2/WPA3-SAE', is_6g || !(features & 2)]
    ];
  }

  function fill_select(select, choices, selected) {
    select.empty();
    choices.forEach(function (choice) {
      $('<option>').val(choice[0]).text(choice[1] + (choice[2] ? ' — ' + text.unavailable : ''))
        .prop('disabled', !!choice[2]).appendTo(select);
    });
    if (!choices.some(function (choice) { return choice[0] === selected; })) {
      $('<option>').val(selected).text(selected).appendTo(select);
    }
    select.val(selected);
  }

  function add_field(card, index, name, label, input) {
    var id = 'wireless-' + name + '-' + index;
    var row = $('<div class="form-row">').attr('data-field', name);
    $('<label class="form-label">').attr('for', id).text(label).appendTo(row);
    input.attr('id', id).attr('data-input', name).appendTo(row);
    row.appendTo(card);
    return input;
  }

  function add_switch(card, index, name, label, checked) {
    var id = 'wireless-' + name + '-' + index;
    var row = $('<div class="form-row">').appendTo(card);
    $('<label class="form-label">').attr('for', id).text(label).appendTo(row);
    var toggle = $('<label class="switch">').appendTo(row);
    $('<input type="checkbox">').attr('id', id).attr('data-input', name).prop('checked', Number(checked) === 1).appendTo(toggle);
    $('<span class="slider">').appendTo(toggle);
  }

  function field(item, name) {
    return item.card.find('[data-input="' + name + '"]');
  }

  function update_security(item) {
    var base = field(item, 'encryption').val() || split_encryption(item.encryption).base;
    var needs_key = base !== 'none' && base !== 'owe';
    var choices = [['auto', text.auto], ['ccmp', 'AES (CCMP)']];
    if (base.indexOf('psk') === 0) choices.push(['tkip', 'TKIP'], ['tkip+ccmp', 'TKIP + AES']);
    var selected = field(item, 'cipher').val() || 'auto';
    if (!item.read_only && !choices.some(function (choice) { return choice[0] === selected; })) selected = 'auto';
    fill_select(field(item, 'cipher'), choices, selected);
    item.card.find('[data-field="password"]').toggle(needs_key);
    item.card.find('[data-field="cipher"]').toggle(needs_key);
  }

  function render_radio(item, index, features) {
    var enc = split_encryption(item.encryption);
    var choices = encryption_options(item, features);
    var simple_cipher = ['auto', 'ccmp', 'tkip', 'tkip+ccmp'].indexOf(enc.cipher) !== -1;
    item.read_only = item.read_only !== false || item.mode !== 'ap' || !item.section ||
      !simple_cipher || !choices.some(function (choice) { return choice[0] === enc.base && !choice[2]; });
    var card = item.card = $('<div class="ssid-card">').appendTo('#ssid-card-list');
    $('<div class="ssid-card-title">').text(item.band && item.band !== 'Unknown' ? item.band : text.unknown).appendTo(card);
    $('<div class="ssid-card-meta">').text(text.device + ': ' + item.radio + ' · ' +
      (Number(item.disabled) ? text.disabled : text.enabled)).appendTo(card);
    var mode_label = item.mode === 'ap' ? text.ap :
      (item.mode === 'sta' ? text.client : (item.mode || text.unknown));
    if (Number(item.wds)) mode_label += ' (WDS)';
    var mode_row = $('<div class="form-row">').appendTo(card);
    $('<span class="form-label">').text(text.mode).appendTo(mode_row);
    $('<span>').text(mode_label).appendTo(mode_row);
    if (item.read_only) {
      var note = !item.section ? text.no_iface : (item.mode !== 'ap' || Number(item.wds) ? text.readonly : text.advanced);
      $('<p class="readonly-note">').text(note).appendTo(card);
    }
    add_switch(card, index, 'enabled', text.enable, !Number(item.disabled));
    add_field(card, index, 'ssid', text.ssid, $('<input type="text" autocomplete="off">').val(item.ssid || ''));
    var encryption = add_field(card, index, 'encryption', text.encryption, $('<select>'));
    fill_select(encryption, choices, enc.base);
    add_field(card, index, 'cipher', text.cipher, $('<select>').append($('<option>').val(enc.cipher).text(enc.cipher)));
    add_field(card, index, 'password', text.password,
      $('<input type="password" autocomplete="new-password">').val(item.password || ''));
    add_switch(card, index, 'hidden', text.hidden, item.hidden);
    add_switch(card, index, 'isolate', text.isolate, item.isolate);
    encryption.on('change', function () { update_security(item); });
    update_security(item);
    item.original = JSON.stringify(collect_item(item));
  }

  function collect_item(item) {
    var base = field(item, 'encryption').val() || split_encryption(item.encryption).base;
    var cipher = field(item, 'cipher').val();
    return {
      radio: item.radio, section: item.section,
      ssid: field(item, 'ssid').val(),
      encryption: base + (base !== 'none' && base !== 'owe' && cipher !== 'auto' ? '+' + cipher : ''),
      password: base === 'none' || base === 'owe' ? '' : field(item, 'password').val(),
      disabled: field(item, 'enabled').is(':checked') ? 0 : 1,
      hidden: field(item, 'hidden').is(':checked') ? 1 : 0,
      isolate: field(item, 'isolate').is(':checked') ? 1 : 0
    };
  }

  function changed_items() {
    return radio_list.filter(function (item) {
      return !item.read_only && item.original !== JSON.stringify(collect_item(item));
    }).map(collect_item);
  }

  function refresh(force) {
    if (busy) return;
    if (force !== true && changed_items().length && !window.confirm(text.discard)) return;
    set_busy(true);
    show_tip(text.loading);
    $.ajax({ url: api_get, dataType: 'json', cache: false, timeout: 15000 }).done(function (resp) {
      if (!resp || (resp.code !== 0 && resp.code !== 2000) || !resp.data || !Array.isArray(resp.data.ssid_list)) {
        show_tip(text.load_failed);
        return;
      }
      radio_list = resp.data.ssid_list;
      $('#ssid-card-list').empty();
      radio_list.forEach(function (item, index) { render_radio(item, index, Number(resp.data.security_features || 0)); });
      show_tip(radio_list.length ? '' : text.no_radio);
    }).fail(function () {
      show_tip(text.load_failed);
    }).always(function () { set_busy(false); });
  }

  function byte_length(value) {
    return new TextEncoder().encode(value).length;
  }

  function validate_item(item) {
    if (/[\x00-\x1f\x7f]/.test(item.ssid) || byte_length(item.ssid) < 1 || byte_length(item.ssid) > 32) return text.ssid_invalid;
    var base = split_encryption(item.encryption).base;
    if (base === 'none' || base === 'owe') return '';
    var len = byte_length(item.password);
    if (/[\x00-\x1f\x7f]/.test(item.password)) return text.key_invalid;
    if (base === 'sae') return len >= 1 && len <= 63 ? '' : text.key_invalid;
    if (base.indexOf('psk') === 0 && /^[0-9a-fA-F]{64}$/.test(item.password)) return '';
    return len >= 8 && len <= 63 ? '' : text.key_invalid;
  }

  function save() {
    if (busy) return;
    var items = changed_items();
    if (!items.length) { show_tip(text.no_changes); return; }
    for (var i = 0; i < items.length; i++) {
      var error = validate_item(items[i]);
      if (error) { show_tip(items[i].radio + ': ' + error); return; }
    }
    if (!window.confirm(text.confirm)) return;
    set_busy(true);
    show_tip('');
    var request_error = '';
    show_restart_modal(function () {
      set_busy(false);
      if (request_error) show_tip(request_error);
      else refresh(true);
    });
    $.ajax({
      url: api_set, method: 'POST', dataType: 'json', timeout: 20000,
      data: { token: csrf_token, data: JSON.stringify({ ssid_list: items }) }
    }).done(function (resp) {
      if (!resp || (resp.code !== 0 && resp.code !== 2000)) {
        request_error = text.save_failed;
      }
    }).fail(function (xhr) {
      request_error = xhr.status === 0 ? text.uncertain : text.save_failed;
    });
  }

  $('#wireless-refresh').on('click', refresh);
  $('#wireless-save').on('click', save);
  $(refresh);
})();
</script>
<%+footer%>
